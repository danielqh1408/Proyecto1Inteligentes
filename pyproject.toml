[project]
name = "tacticalgrid"
version = "0.1.0"
description = "Juego táctico 2D con búsqueda y toma de decisiones (Sistemas Inteligentes I, UCaldas)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["entrega: comprobaciones que solo deben pasar al momento de entregar (pytest -m entrega)"]
addopts = "-m 'not entrega'"
